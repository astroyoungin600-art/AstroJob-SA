<!DOCTYPE html>
<html><head>
<title>Post a Job - Astro Job SA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2133699761079270" crossorigin="anonymous"></script>
<style>body{font-family:system-ui;max-width:800px;margin:auto;padding:15px}input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{background:#0a2a8a;color:#fff;padding:14px;border:0;border-radius:10px;width:100%;font-weight:800;font-size:16px}</style>
</head><body>
<h1 style="text-align:center;color:#0a2a8a">Post a Job</h1>
<p style="text-align:center;color:#666">Astro Job SA • Reach thousands</p>

<!-- AD #1 TOP - High paying recruitment ads -->
<div style="margin:15px 0"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2133699761079270" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<form method="POST" action="/post-job">
<input name="title" placeholder="Job Title e.g. Software Developer" required>
<input name="company" placeholder="Company Name e.g. Astro Tech (Pty) Ltd" required>
<select name="location"><option>Johannesburg</option><option>Cape Town</option><option>Durban</option><option>Pretoria</option><option>Remote</option><option>South Africa</option></select>
<select name="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Work From Home</option></select>
<input name="salary" placeholder="Salary Range (ZAR) e.g. R25k-R40k per month">
<textarea name="description" rows="5" placeholder="Job Description - role, responsibilities, requirements..." required></textarea>

<!-- AD #2 MIDDLE - Between form and button = highest CTR -->
<div style="margin:18px 0;background:#f8fafc;padding:8px;border-radius:12px"><small style="color:#888">Sponsored</small>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2133699761079270" data-ad-slot="auto" data-ad-format="fluid" data-ad-layout="in-article"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<button type="submit">Post Job</button>
</form>

<!-- AD #3 BOTTOM -->
<div style="margin:20px 0"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2133699761079270" data-ad-slot="auto" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<div style="text-align:center;margin-top:15px"><a href="/" style="color:#0a2a8a;text-decoration:none;font-weight:700">← Back to Jobs</a></div>
</body></html>
