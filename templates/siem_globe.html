<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>SIEM LIVE</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{background:#0a0e1a;color:#e2e8f0;font-family:system-ui;padding:10px} .card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:10px;margin:10px 0}</style></head><body><h2>🛡️ ASTRO SIEM - LIVE</h2><div id="stats"></div><div class="card"><canvas id="trafficChart" height="120"></canvas></div><div class="card"><canvas id="attackChart" height="120"></canvas></div><div class="card"><table id="malTable"></table></div><div class="card"><table id="goodTable"></table></div><script>async function load(){let r=await fetch('/api/security-logs');let d=await r.json();document.getElementById('stats').innerHTML=`Total:${d.total} Blocked:${d.blocked} Unique:${d.uniq}`; if(window.tChart)window.tChart.destroy(); window.tChart=new Chart(document.getElementById('trafficChart'),{type:'line',data:{labels:d.hours,datasets:[{label:'Visits',data:d.visits,borderColor:'#22c55e'},{label:'Attacks',data:d.attacks,borderColor:'#ef4444'}]}}); window.aChart=new Chart(document.getElementById('attackChart'),{type:'bar',data:{labels:Object.keys(d.attackTypes),datasets:[{data:Object.values(d.attackTypes)}]}}); let mt=document.getElementById('malTable');mt.innerHTML=d.malicious.map(m=>`<tr><td>${m.ip}</td><td>${m.reason}</td><td>${m.time}</td></tr>`).join(''); let gt=document.getElementById('goodTable');gt.innerHTML=d.legit.map(g=>`<tr><td>${g.ip}</td><td>${g.page}</td><td>${g.time}</td></tr>`).join('');}load();setInterval(load,5000);</script></body></html>
