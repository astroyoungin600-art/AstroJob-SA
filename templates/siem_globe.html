<html><head>
<script src="//unpkg.com/globe.gl"></script>
<style>body{margin:0;background:#000;color:#fff} #info{position:absolute;top:10px;left:10px;z-index:2}</style>
</head><body>
<div id="info"><h2>AstroJobSA SIEM - LIVE</h2><p id="count">Loading...</p></div>
<div id="globe"></div>
<script>
fetch('/api/threats').then(r=>r.json()).then(data=>{
 document.getElementById('count').innerText = data.length+' threats blocked'
 Globe()(document.getElementById('globe'))
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
  .pointsData(data)
  .pointLat('lat').pointLng('lng').pointColor(()=>'red').pointAltitude(0.1)
  .pointLabel(d=> `${d.city} - ${d.type}`)
})();
</script></body></html>
