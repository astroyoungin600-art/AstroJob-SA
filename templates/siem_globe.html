<!DOCTYPE html><html><head><title>SIEM v4.0 Advanced</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css"></head>
<body><h2>🛡️ SIEM v4.0 ADVANCED <span style="font-size:12px;color:#22c55e">LIVE</span></h2><p id="time"></p>
<div class="grid">
<div class="card">Total<b id="total">0</b></div><div class="card">Visits<b id="visits" class="green">0</b></div><div class="card">Attacks<b id="blocked" class="red">0</b></div><div class="card">Honeypot<b id="honey" class="yellow">0</b></div><div class="card">Malware<b id="mal" class="red">0</b></div><div class="card">Blacklisted<b id="black">0</b></div>
</div>
<h3>🔥 Top Threat Scores (Behavioural)</h3><table><thead><tr><th>IP</th><th>City</th><th>Score</th><th>Risk</th></tr></thead><tbody id="scores"></tbody></table>
<h3>⚠️ Recent Attacks</h3><table><thead><tr><th>IP</th><th>Reason</th><th>City</th><th>Score</th><th>Time</th></tr></thead><tbody id="mal"></tbody></table>
<h3>✅ Recent Legit Visits</h3><table><thead><tr><th>IP</th><th>Page</th><th>Time</th></tr></thead><tbody id="legit"></tbody></table>
<p><a href="/siem/logout">Logout</a> | Auto-refresh 3s | Score 80+ = Auto-ban, 100+ = Alert</p>
<script>
async function load(){
  let r=await fetch('/api/security-logs'); let d=await r.json();
  document.getElementById('total').textContent=d.total;
  document.getElementById('visits').textContent=d.visits_ever;
  document.getElementById('blocked').textContent=d.blocked;
  document.getElementById('honey').textContent=d.honeypot_ever;
  document.getElementById('mal').textContent=d.malware_ever;
  document.getElementById('black').textContent=d.blacklist||0;
  document.getElementById('time').textContent=d.server_time+' | v'+d.version;
  document.getElementById('scores').innerHTML=(d.top_scores||[]).map(s=>`<tr><td>${s.ip}</td><td>${s.city}</td><td>${s.score}</td><td><span class="badge ${s.score>=80?'high':s.score>=40?'med':'low'}">${s.score>=80?'CRITICAL':s.score>=40?'MEDIUM':'LOW'}</span></td></tr>`).join('')||'<tr><td colspan=4>No threats yet</td></tr>';
  document.getElementById('mal').innerHTML=(d.malicious||[]).map(m=>`<tr><td>${m.ip}</td><td>${m.reason}</td><td>${m.city||''}</td><td>${m.score||0}</td><td>${m.time}</td></tr>`).join('');
  document.getElementById('legit').innerHTML=(d.legit||[]).map(l=>`<tr><td>${l.ip}</td><td>${l.page}</td><td>${l.time}</td></tr>`).join('');
}
load(); setInterval(load,3000);
</script><a class="coffee-hang" href="https://www.buymeacoffee.com/astrojobsa" target="_blank" rel="noopener">☕ Buy Me a Coffee</a>

<!-- FUN -->
<button class="party-btn" onclick="toggleParty(this)">🎉 Party Mode</button>
<div class="float-emoji" style="left:12px">🚀</div>
<div class="float-emoji" style="right:12px;animation-delay:1s">💼</div>
<script>
function toggleParty(btn){
  document.body.classList.toggle('party');
  btn.classList.toggle('active');
  btn.textContent = document.body.classList.contains('party') ? '✨ Party ON - Tap to Stop' : '🎉 Party Mode';
  if(document.body.classList.contains('party')) confetti();
}
function confetti(){
  const emojis=['🎉','✨','💰','🚀','💼','🌟','🎊','🔥'];
  for(let i=0;i=0;i<24;i++){
    let s=document.createElement('div'); s.className='confetti'; s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(Math.random()*2+2)+'s'; s.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),4000);
  }
}
// Confetti when you click Apply
document.addEventListener('click',e=>{
  if(e.target.closest('.btn-apply')) confetti();
  if(e.target.closest('.coffee-hang')) confetti();
});
// Fun motivation every 30 sec
const quotes=['🔥 You got this! Your next job is waiting.','💰 Soweto to Sandton - you deserve it!','🚀 One Apply = One step closer!','⭐ Mthembisi believes in you!'];
setInterval(()=>{ if(Math.random()>0.5) alert(quotes[Math.floor(Math.random()*quotes.length)]) },60000);
</script>

<!-- Light/Dark Toggle -->
<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
<script>
function toggleTheme(){
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('astroTheme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
// Load saved choice on every page - default LIGHT
(function(){
  const saved = localStorage.getItem('astroTheme');
  if(saved === 'dark'){
    document.body.classList.add('dark');
    const b = document.getElementById('themeBtn');
    if(b) b.textContent = '☀️ Light';
  }
})();
</script>
</body>

</html>
