<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free CV Builder - Astro Job SA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2133699761079270" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-[#f8fafc]">
<div style="background:#25D366;color:white;text-align:center;padding:12px;font-weight:800">🔥 500+ Jobs Daily <a href="https://whatsapp.com/channel/0029VbDh9dGK5cDEn5Epcw0F" style="background:white;color:#25D366;padding:6px 12px;border-radius:20px;margin-left:8px;text-decoration:none">📲 Follow Jobsa🇿🇦</a></div>

<div class="max-w-[1300px] mx-auto flex flex-col lg:flex-row">
  <div class="w-full lg:w-[400px] bg-white p-6 order-2 lg:order-1">
    <a href="/" class="text-xs text-gray-400">← Back to Jobs</a>
    <h1 class="text-2xl font-black mt-2">CV Builder <span class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded-full">PRO</span></h1>
    <div class="mt-4 bg-gray-900 text-white rounded-xl p-4"><div class="text-xs opacity-70">PRO R99 - BEST SELLER</div><div class="font-bold text-sm">10 Templates + Cover Letter</div><div class="text-[11px] opacity-70 mt-1">Pay: 081 260 2918 (Mthembisi) - 2hrs delivery</div><a href="https://wa.me/27812602918?text=Hi%20Mthembisi%20🔥%20I%20want%20Pro%20CV%20R99" class="mt-2 inline-block bg-[#25D366] text-white px-4 py-2 rounded-full text-xs font-black">WhatsApp Order</a></div>

    <div class="mt-5 space-y-3">
      <input id="fName" placeholder="Full Name" class="w-full border rounded-lg p-3" oninput="render()">
      <input id="fTitle" placeholder="Job Title e.g. Driver Code 14" class="w-full border rounded-lg p-3" oninput="render()">
      <input id="fPhone" placeholder="Phone" class="w-full border rounded-lg p-3" oninput="render()">
      <input id="fEmail" placeholder="Email" class="w-full border rounded-lg p-3" oninput="render()">
      <textarea id="fSummary" rows="3" placeholder="Professional Summary" class="w-full border rounded-lg p-3" oninput="render()"></textarea>
      <textarea id="fExp" rows="4" placeholder="Experience: Role | Company | Year - Desc" class="w-full border rounded-lg p-3" oninput="render()"></textarea>
      <textarea id="fEdu" rows="2" placeholder="Education: Grade 12 | School | 2019" class="w-full border rounded-lg p-3" oninput="render()"></textarea>
      <input id="fSkills" placeholder="Skills, comma separated" class="w-full border rounded-lg p-3" oninput="render()">
    </div>
    <button onclick="downloadPDF()" class="w-full bg-[#0a2a8a] text-white py-4 rounded-xl font-black mt-5">⬇ Download Free CV</button>
  </div>

  <div class="flex-1 bg-gray-200 p-4 flex justify-center order-1 lg:order-2">
    <div id="cv" class="bg-white w-full max-w-[700px] shadow-xl p-8 text-[13px]"><div class="flex justify-between border-b-4 border-black pb-4"><div><h1 id="pName" class="text-2xl font-black uppercase">YOUR NAME</h1><p id="pTitle" class="text-blue-700 font-bold text-xs uppercase mt-1">Job Title</p></div><div class="text-right text-[11px]"><div id="pPhone">Phone</div><div id="pEmail">Email</div></div></div><div class="mt-6"><div id="pSummary" class="text-xs text-gray-600"></div><div id="pExp" class="mt-4 text-xs"></div><div id="pSkills" class="mt-4 flex flex-wrap gap-1"></div><div id="pEdu" class="mt-4 text-xs"></div></div></div>
  </div>
</div>

<script>
function render(){
  const v=id=>document.getElementById(id).value.trim();
  document.getElementById('pName').innerText=v('fName')||'YOUR NAME';
  document.getElementById('pTitle').innerText=v('fTitle')||'Job Title';
  document.getElementById('pPhone').innerText=v('fPhone')||'Phone';
  document.getElementById('pEmail').innerText=v('fEmail')||'Email';
  document.getElementById('pSummary').innerText=v('fSummary')||'';
  document.getElementById('pSkills').innerHTML=v('fSkills').split(',').map(s=>`<span class="bg-black text-white text-[10px] px-2 py-1 rounded-full">${s.trim()}</span>`).join('');
  document.getElementById('pEdu').innerHTML=v('fEdu');
  document.getElementById('pExp').innerHTML=v('fExp').replace(/\n/g,'<br>');
}
function downloadPDF(){
  const el=document.getElementById('cv');
  html2pdf().set({margin:5, filename:'CV_AstroJob.pdf', html2canvas:{scale:2}, jsPDF:{format:'a4'}}).from(el).save();
}
render();
</script>
</body>
</html>
